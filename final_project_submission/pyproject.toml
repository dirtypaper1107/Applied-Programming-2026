[project]
name = "applied-programming-2025"
version = "0.1.0"
description = "The exercises for the Applied Programming class of 2025"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.4",
    "scipy>=1.12,<2",
    "PySide6>=6.7,<7",
    "vispy>=0.14,<1",
    "matplotlib>=3.8,<4",
    "marimo>=0.9,<1",
    "panda==0.3.1",
    "pandas>=3.0.2",
    "scipy-stubs~=1.17.1",
    "pandas-stubs~=3.0.2",
]

[dependency-groups]
staff = [
    "nbformat>=5.10.4",
]
